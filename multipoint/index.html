<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="月隱塔羅的三點、五點與七點牌陣，從牌位權重、相鄰配對和牌義看見推力與阻力。">
  <meta name="theme-color" content="#120d19">
  <title>多點塔羅牌陣｜月隱塔羅</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 40 40'%3E%3Crect width='40' height='40' rx='9' fill='%23231830'/%3E%3Cpath d='M26 9a12 12 0 1 0 5 19A11 11 0 0 1 26 9Z' fill='%23f1cf9d'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="../assets/style.css">
  <link rel="stylesheet" href="../assets/multipoint.css">
  <script defer src="../assets/multipoint.js"></script>
</head>
<body class="multipoint-page">
  <header class="top">
    <div class="container nav">
      <a href="../" class="brand"><span class="brand-icon" aria-hidden="true">☾</span><span>月隱塔羅<small>MOONVEIL TAROT</small></span></a>
      <a href="../" class="secondary home-link">返回首頁</a>
    </div>
  </header>
  <main id="tarot-reading">
    <section class="hero multipoint-hero" aria-labelledby="multipoint-title">
      <div class="container multipoint-hero-inner">
        <h1 id="multipoint-title">多點塔羅牌陣</h1>
        <p class="intro">從三點、五點或七點牌陣，整理眼前的推力、阻力與下一步。</p>
      </div>
    </section>
    <div class="container multipoint-content">
      <section class="multipoint-panel" aria-label="抽牌設定和牌位">
        <form id="form">
          <div class="multipoint-controls">
            <label class="question-field" for="question">
              占問 <span class="optional">（選填）</span>
              <input id="question" name="question" type="text" maxlength="100" autocomplete="off" placeholder="例如：面對眼前的變動，我該從哪裡開始？">
            </label>
            <label class="spread-field" for="spread-select">牌陣
              <select id="spread-select" name="spread">
                <option value="3">三點</option>
                <option value="5" selected>五點</option>
                <option value="7">七點</option>
              </select>
            </label>
            <div class="multipoint-actions">
              <button class="primary" id="draw" type="submit">抽牌並計算</button>
              <button class="secondary" id="clear" type="button" hidden>清除結果</button>
            </div>
          </div>
        </form>
        <section class="spread-board" aria-labelledby="board-title">
          <h2 id="board-title">五點牌陣</h2>
          <p class="text-muted" id="board-desc"></p>
          <ol class="positions" id="cards"></ol>
          <p class="text-muted text-small" id="hint"></p>
        </section>
        <noscript><p>請啟用瀏覽器的 JavaScript 以使用抽牌功能。</p></noscript>
      </section>

      <p class="sr-only" id="status" role="status" aria-live="polite"></p>

      <section class="multipoint-panel multipoint-result" id="result" aria-labelledby="result-title" hidden>
        <h2 id="result-title" tabindex="-1">牌陣解讀</h2>
        <p class="text-muted" id="reading-question" hidden></p>
        <div class="reading-overview">
          <div class="score-body">
            <h3 class="kicker">牌陣推進指數</h3>
            <p class="score-value"><span id="score"></span><span class="score-scale"> / 100</span></p>
            <p id="band"></p>
            <div class="progress" role="progressbar" aria-label="牌陣推進指數" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><div class="progress-bar" id="bar"></div></div>
          </div>
          <section class="reading-section" aria-labelledby="overview-title">
            <h3 id="overview-title">整體解讀</h3>
            <p id="summary"></p>
            <p id="pairing"></p>
          </section>
        </div>
        <section class="reading-section" aria-labelledby="positions-title">
          <h3 id="positions-title">各牌位的提醒</h3>
          <ul class="lines" id="reading"></ul>
        </section>
        <section class="reading-conclusion" aria-labelledby="conclusion-title">
          <h3 id="conclusion-title">結語</h3>
          <p id="conclusion"></p>
        </section>
        <details id="trace">
          <summary>展開計算明細</summary>
          <div class="trace" id="trace-body"></div>
        </details>
      </section>
    </div>
  </main>
  <footer>
    <div class="container footer">
      <a href="../" class="brand"><span class="brand-icon" aria-hidden="true">☾</span>月隱塔羅</a>
      <p>塔羅解讀供娛樂與自我反思。</p>
    </div>
  </footer>
</body>
</html>
